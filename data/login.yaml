# 登录接口数据驱动用例
cases:
  - name: 登录成功
    request: { username: user01, password: "123456" }
    expect:
      code: 0
      msg: 登录成功
      data_not_null: [ token ]
      data_eq: { "user.username": user01, "user.role": user }
  - name: 密码错误
    request: { username: user01, password: wrong-pass }
    expect:
      code: 2003
      msg: 密码错误
  - name: 用户不存在
    request: { username: nobody_zzz, password: "123456" }
    expect:
      code: 2002
  - name: 参数缺失
    request: { username: "", password: "" }
    expect:
      status: 400
      code: 1001
  - name: 密码类型错误
    request: { username: user01, password: 123456 }
    expect:
      status: 400
      code: 1001
